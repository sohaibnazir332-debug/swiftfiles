name: Build SwiftFiles

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project folder dhoondo (pubspec.yaml kahan hai)
        id: find
        shell: bash
        run: |
          P=$(find . -name pubspec.yaml -not -path "*/build/*" -not -path "*/.dart_tool/*" -not -path "*/.git/*" | head -n 1)
          if [ -z "$P" ]; then
            echo "::error::pubspec.yaml repo mein nahi mili."
            exit 1
          fi
          echo "dir=$(dirname "$P")" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter pub get

      - name: Code check
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter analyze

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.find.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
