name: swift_files
description: SwiftFiles - ultra-fast, clean file manager for Android and Windows.
publish_to: 'none'
version: 0.4.2+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path: ^1.9.0
  permission_handler: ^11.3.1
  shelf: ^1.4.1
  open_filex: ^4.5.0
  qr_flutter: ^4.1.0
  archive: ^3.6.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
